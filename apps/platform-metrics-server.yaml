# =============================================================================
# Application `platform-metrics-server` — metrics-server (chart oficial, fijado).
# -----------------------------------------------------------------------------
# KIND no lo trae. Se necesita para `kubectl top` (medición de recursos del
# stack de CI) y para que el HPA del webhook de Tekton pueda calcular métricas.
# Sync wave -1: antes que Tekton.
# `--kubelet-insecure-tls`: los kubelets de KIND usan certificados autofirmados.
# Solo es aceptable en este cluster de demo local.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: quicktask-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      releaseName: metrics-server
      valuesObject:
        args:
          - --kubelet-insecure-tls
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
